<style>
  :root{
    --bg:#080c18; --surface:#0f1624; --surface2:#161f33; --border:#1c2840;
    --accent:#4f8ef7; --accent2:#22d3ee; --text:#dde4f0; --text-muted:#4d6080;
    --green:#34d399; --teal:#22d3ee; --amber:#fbbf24; --red:#fb7185;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
  .header{background:linear-gradient(180deg,#0d1626 0%,#080c18 100%);border-bottom:1px solid var(--border);
    padding:18px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-left h1{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .header-left p{font-size:11px;color:var(--text-muted);margin-top:3px;letter-spacing:.4px;}
  .header-left-wrap{display:flex;align-items:center;}
  .back-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;margin-right:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);
    font-size:11px;text-decoration:none;font-family:'Noto Sans TC',sans-serif;transition:all .15s;white-space:nowrap;}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1);}
  .legend-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--text-muted);}
  .dot{width:10px;height:10px;border-radius:50%;}

  .controls{padding:14px 28px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ctrl-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px;}
  .btn{padding:5px 13px;border:1px solid var(--border);border-radius:5px;background:var(--surface);
    color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
  .btn:hover,.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1);}
  .field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;padding:3px 8px;}
  .field label{font-size:11px;color:var(--text-muted);}
  .field input{background:transparent;border:none;outline:none;color:var(--text);width:62px;
    font-family:'Space Mono',monospace;font-size:12px;}
  .search-input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);
    padding:5px 12px;font-size:12px;width:160px;outline:none;font-family:'Noto Sans TC',sans-serif;margin-left:auto;}
  .search-input:focus{border-color:var(--accent);}

  .summary{margin:12px 28px 0;padding:12px 18px;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  .si{display:flex;flex-direction:column;gap:1px;}
  .si-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
  .si-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;}
  .si-val.up{color:var(--green);} .si-val.down{color:var(--red);}

  .chart-wrap{margin:16px 28px 0;padding:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;height:600px;position:relative;}

  .table-wrap{margin:18px 28px 40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
    position:sticky;top:0;background:var(--surface2);user-select:none;}
  th:hover{color:var(--accent);}
  th.l,td.l{text-align:left;}
  td.code{font-family:'Space Mono',monospace;color:var(--accent2);}
  td.name{font-weight:600;}
  .num{font-family:'Space Mono',monospace;}
  .up{color:var(--green);} .down{color:var(--red);}
  tr.row:hover{background:rgba(79,142,247,.07);}
  tr.row.hl{background:rgba(245,158,11,.12);}
  .q-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;}
  .crash-badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:4px;font-size:10px;font-weight:700;
    background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.45);color:var(--red);letter-spacing:.3px;}
  .tabs{display:flex;gap:6px;margin:14px 28px 0;border-bottom:1px solid var(--border);}
  .tab{padding:8px 18px 7px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted);
    background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
    font-family:'Noto Sans TC',sans-serif;transition:all .15s;margin-bottom:-1px;}
  .tab:hover{color:var(--accent);}
  .tab.active{background:var(--surface);border-color:var(--border);color:var(--accent);}
  .tab.stress.active{color:var(--red);}
  .tab.rebound.active{color:var(--green);}
  .player{display:none;align-items:center;gap:10px;margin-left:10px;}
  .player input[type=range]{width:180px;accent-color:var(--accent2);}
  .frame-info{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent2);min-width:150px;font-weight:700;}
</style>
</head>

const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();
let showLabels = true, dividerMode = 'mkt', highlight = '', mode = 'ytd', dateIdx = 0;
let sortKey = 'ret', sortDir = -1;

const SNAP = () => DATA.snapshots[mode==='ytd' ? dateIdx : 0];  // 壓測/反彈固定用最新快照
const MD = d => {const p=d.split('-');return +p[1]+'/'+ +p[2];};  // '2026-07-21' → '7/21'
let frame = 0;                                                   // 反彈動畫目前影格
const REB = r => DATA.rebound.rows[r.code][frame];               // 個股反彈%（當前影格）
const RV = r => mode==='ytd' ? r.ret : mode==='stress' ? r.sret : REB(r);
const VV = r => mode==='ytd' ? r.vol : mode==='stress' ? r.svol : r.sret;  // 反彈模式 x 軸 = 壓測跌幅

function median(arr){const a=[...arr].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function mktRet(){return parseFloat(document.getElementById('mktRet').value)||0;}
function mktVol(){const v=document.getElementById('mktVol').value;return v===''?null:parseFloat(v);}
function vDiv(){const mv=mktVol();return (dividerMode==='mkt'&&mv!=null)?mv:median(SNAP().rows.map(r=>VV(r)));}

function quadColor(r){
  const overMkt = RV(r) >= mktRet();
  const hiVol = VV(r) >= vDiv();
  if(mode==='rebound'){                          // x=壓測跌幅：左=跌深、右=抗跌
    if(overMkt && !hiVol) return C('--green');   // 跌深·反彈領先（V轉）
    if(overMkt && hiVol)  return C('--teal');    // 抗跌·反彈領先
    if(!overMkt && hiVol) return C('--amber');   // 抗跌·反彈落後
    return C('--red');                            // 跌深·反彈落後（警示）
  }
  if(overMkt && !hiVol) return C('--green');   // 贏大盤·低波動
  if(overMkt && hiVol)  return C('--teal');    // 贏大盤·高波動
  if(!overMkt && !hiVol)return C('--amber');   // 輸大盤·低波動
  return C('--red');                            // 輸大盤·高波動
}

// crosshair + quadrant background plugin
const crosshair = {
  id:'crosshair',
  beforeDatasetsDraw(chart){
    const {ctx,chartArea:a,scales:{x,y}} = chart;
    const yMkt = y.getPixelForValue(mktRet());
    const xDiv = x.getPixelForValue(vDiv());
    ctx.save();
    // quadrant shading (very subtle)
    const tints=[['--green',a.left,a.top,xDiv,yMkt],['--teal',xDiv,a.top,a.right,yMkt],
                 ['--amber',a.left,yMkt,xDiv,a.bottom],['--red',xDiv,yMkt,a.right,a.bottom]];
    tints.forEach(([col,x0,y0,x1,y1])=>{ctx.fillStyle=hexA(C(col),0.05);ctx.fillRect(x0,y0,x1-x0,y1-y0);});
    // lines
    ctx.setLineDash([5,4]); ctx.lineWidth=1.4;
    ctx.strokeStyle=hexA(C('--accent2'),0.85);
    ctx.beginPath();ctx.moveTo(a.left,yMkt);ctx.lineTo(a.right,yMkt);ctx.stroke();
    ctx.strokeStyle=hexA(C('--text-muted'),0.7);
    ctx.beginPath();ctx.moveTo(xDiv,a.top);ctx.lineTo(xDiv,a.bottom);ctx.stroke();
    ctx.setLineDash([]);
    // labels
    ctx.font="600 11px 'Space Mono',monospace";
    ctx.fillStyle=C('--accent2');ctx.textAlign='left';
    ctx.fillText(`大盤 ${mktRet().toFixed(1)}%`,a.left+6,yMkt-6);
    ctx.fillStyle=C('--text-muted');ctx.textAlign='center';
    ctx.fillText(mode==='rebound'?(dividerMode==='mkt'?'大盤壓測跌幅':'跌幅中位數')
      :(dividerMode==='mkt'&&mktVol()!=null?'大盤波動':'波動中位數'),xDiv,a.top+12);
    // quadrant captions
    ctx.font="700 12px 'Noto Sans TC'";ctx.globalAlpha=.5;
    ctx.fillStyle=C('--green');ctx.textAlign='left';
    ctx.fillText(mode==='ytd'?'高效率區（贏大盤·低波動）':mode==='stress'?'抗跌區（跌少於大盤·低波動）':'跌深強彈（V型反轉·領先大盤）',a.left+8,a.top+30);
    ctx.fillStyle=C('--red');ctx.textAlign=mode==='rebound'?'left':'right';
    if(mode==='rebound')ctx.fillText('跌深弱彈（反彈落後·警示）',a.left+8,a.bottom-10);
    else ctx.fillText(mode==='ytd'?'警示區（輸大盤·高波動）':'重挫區（跌多於大盤·高波動）',a.right-8,a.bottom-10);
    ctx.globalAlpha=1;ctx.restore();
  }
};
function hexA(hex,al){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${al})`;}

let chart;
function buildChart(){
  const pts = SNAP().rows.map(r=>({x:VV(r),y:RV(r),r:r}));
  const mv = mktVol();
  const mktPoint = mv!=null ? [{x:mv,y:mktRet(),mkt:true}] : [];
  // explicit axis bounds with headroom so edge points + labels aren't clipped
  const vols=SNAP().rows.map(r=>VV(r)).concat(mv!=null?[mv]:[]);
  const rets=SNAP().rows.map(r=>RV(r)).concat([mktRet()]);
  const padT=mode==='ytd'?30:10, padB=mode==='ytd'?15:8;
  if(mode==='rebound'){  // y 軸涵蓋所有影格，動畫過程不重新縮放
    rets.length=0;
    Object.values(DATA.rebound.rows).forEach(a=>rets.push(...a));
    rets.push(...DATA.rebound.market);
  }
  const xMin=Math.floor((Math.min(...vols)-6)/5)*5, xMax=Math.ceil((Math.max(...vols)+7)/5)*5;
  const yMin=Math.floor((Math.min(...rets)-padB)/10)*10, yMax=Math.ceil((Math.max(...rets)+padT)/10)*10;
  const ctx=document.getElementById('chart');
  chart=new Chart(ctx,{
    type:'scatter',
    data:{datasets:[
      {label:'個股',data:pts,parsing:false,
        pointRadius:c=>pointR(c),pointHoverRadius:c=>pointR(c)+3,
        backgroundColor:c=>hexA(quadColor(c.raw.r),isHL(c.raw.r)?0.95:0.78),
        borderColor:c=>isHL(c.raw.r)?C('--amber'):'rgba(255,255,255,.25)',
        borderWidth:c=>isHL(c.raw.r)?2.5:1},
      {label:'大盤',data:mktPoint,parsing:false,pointStyle:'rectRot',pointRadius:11,pointHoverRadius:14,
        backgroundColor:C('--accent2'),borderColor:'#fff',borderWidth:2,datalabels:{display:false}}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:mode==='rebound'?700:400,easing:'easeInOutCubic'},
      layout:{padding:{top:18,right:54,left:6,bottom:4}},
      scales:{
        x:{min:xMin,max:xMax,title:{display:true,
          text:mode==='ytd'?'年化波動度 (%)　→ 風險越高':mode==='stress'?'壓測年化波動度 6/23→7/17 (%)　→ 風險越高':'壓測跌幅 6/23→7/17 (%)　← 跌得越深',
          color:C('--text-muted'),font:{size:12}},
          grid:{color:'rgba(28,40,64,.6)'},ticks:{color:C('--text-muted')}},
        y:{min:yMin,max:yMax,title:{display:true,
          text:mode==='ytd'?'YTD 報酬率 (%)　→ 表現越好':mode==='stress'?'壓測跌幅 6/23→7/17 (%)　→ 越抗跌':'反彈幅度 自 7/17 收盤 (%)　→ 彈得越強',
          color:C('--text-muted'),font:{size:12}},
          grid:{color:'rgba(28,40,64,.6)'},ticks:{color:C('--text-muted')}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:c=>c[0].raw.mkt?'加權指數（大盤）':`${c[0].raw.r.code} ${c[0].raw.r.name}`,
          label:c=>{if(c.raw.mkt)return mode==='ytd'
              ?[`YTD報酬：${mktRet().toFixed(1)}%`,`年化波動：${SNAP().market.vol.toFixed(1)}%`,`最大回檔：${SNAP().market.mdd.toFixed(1)}%`]
              :mode==='rebound'
              ?[`反彈（7/17→${MD(DATA.rebound.dates[frame])}）：${DATA.rebound.market[frame].toFixed(1)}%`]
              :[`壓測跌幅：${DATA.stress.ret.toFixed(1)}%（自盤中高點 ${DATA.stress.fromHigh.toFixed(1)}%）`,`壓測波動：${DATA.stress.svol.toFixed(1)}%（高點前 ${DATA.stress.pvol.toFixed(1)}%）`];
            if(mode==='rebound'){const r=c.raw.r,rb=REB(r),mk=DATA.rebound.market[frame],lead=rb-mk;
              return [`反彈（7/17→${MD(DATA.rebound.dates[frame])}）：${rb.toFixed(1)}%`,
                `相對大盤：${lead>=0?'+':''}${lead.toFixed(1)}%`,
                `壓測跌幅：${r.sret.toFixed(1)}%`,
                `收復率：${(rb/Math.abs(r.sret)*100).toFixed(0)}%`,
                `現價：${DATA.rebound.px?DATA.rebound.px[r.code]:r.last}（7/17 收 ${r.last}）`];}
            const r=c.raw.r;const ex=(r.ret-SNAP().market.ret).toFixed(1);
            const lines=[`YTD報酬：${r.ret.toFixed(1)}%`,`年化波動：${r.vol.toFixed(1)}%`,`最大回檔：${r.mdd.toFixed(1)}%`,
              `相對大盤：${ex>=0?'+':''}${ex}%`,`報酬/波動：${(r.ret/r.vol).toFixed(2)}`,`價：${r.base}→${r.last}`];
            if(r.sret!=null)lines.push(`── 壓測 6/23→7/17 ──`,`跌幅：${r.sret.toFixed(1)}%`,
              `波動：${r.pvol.toFixed(1)}→${r.svol.toFixed(1)}%（${r.svol-r.pvol>=0?'+':''}${(r.svol-r.pvol).toFixed(1)}）`);
            return lines;}
        }},
        datalabels:{display:c=>showLabels&&c.dataset.label==='個股',
          formatter:(v)=>v&&v.r?v.r.name:'',
          color:c=>{const p=c.dataset.data[c.dataIndex];return p&&p.r?quadColor(p.r):'#fff';},
          font:{size:9,weight:'600'},anchor:'end',align:'top',offset:3,clip:false}
      }
    },
    plugins:[crosshair,ChartDataLabels]
  });
}
function pointR(c){const r=c.raw.r; if(!r)return 6; const a=Math.abs(mode==='rebound'?r.sret:r.mdd); return 5+Math.min(a/6,7);}
function isHL(r){return highlight && (r.code.includes(highlight)||r.name.includes(highlight));}

function renderSummary(){
  const rows=SNAP().rows, m=mktRet();
  const cls=v=>v>=0?'up':'down';
  if(mode==='rebound'){
    const R=DATA.rebound, li=R.dates.length-1, mk=R.market[li];
    const rebs=rows.map(r=>({name:r.name,v:R.rows[r.code][li]}));
    const win=rebs.filter(x=>x.v>mk).length;
    const avg=rebs.reduce((s,x)=>s+x.v,0)/rebs.length;
    const med=median(rebs.map(x=>x.v));
    const best=rebs.reduce((a,b)=>a.v>b.v?a:b), worst=rebs.reduce((a,b)=>a.v<b.v?a:b);
    document.getElementById('summary').innerHTML=`
      <div class="si"><span class="si-label">檔數</span><span class="si-val">${rows.length}</span></div>
      <div class="si"><span class="si-label" style="color:var(--green);">大盤反彈 7/17→${MD(R.dates[li])}</span>
        <span class="si-val ${cls(mk)}">${mk>=0?'+':''}${mk.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">反彈領先大盤</span><span class="si-val up">${win} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
      <div class="si"><span class="si-label">平均反彈</span><span class="si-val ${cls(avg)}">${avg>=0?'+':''}${avg.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">中位數反彈</span><span class="si-val ${cls(med)}">${med>=0?'+':''}${med.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">最強反彈</span><span class="si-val up">${best.name} ${best.v>=0?'+':''}${best.v.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">最弱</span><span class="si-val down">${worst.name} ${worst.v.toFixed(1)}%</span></div>`;
    return;
  }
  if(mode==='stress'){
    const win=rows.filter(r=>r.sret>m).length;
    const avg=rows.reduce((s,r)=>s+r.sret,0)/rows.length;
    const med=median(rows.map(r=>r.sret));
    const best=rows.reduce((a,b)=>a.sret>b.sret?a:b), worst=rows.reduce((a,b)=>a.sret<b.sret?a:b);
    const volUp=rows.filter(r=>r.svol>r.pvol).length;
    document.getElementById('summary').innerHTML=`
      <div class="si"><span class="si-label">檔數</span><span class="si-val">${rows.length}</span></div>
      <div class="si"><span class="si-label" style="color:var(--red);">大盤壓測跌幅</span>
        <span class="si-val down">${m.toFixed(1)}%<span style="color:var(--text-muted);font-size:11px;font-weight:400;">（自盤中高點 ${DATA.stress.fromHigh.toFixed(1)}%）</span></span></div>
      <div class="si"><span class="si-label">抗跌（優於大盤）</span><span class="si-val up">${win} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
      <div class="si"><span class="si-label">平均跌幅</span><span class="si-val ${cls(avg)}">${avg.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">中位數跌幅</span><span class="si-val ${cls(med)}">${med.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">最抗跌</span><span class="si-val up">${best.name} ${best.sret.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">最重挫</span><span class="si-val down">${worst.name} ${worst.sret.toFixed(1)}%</span></div>
      <div class="si"><span class="si-label">波動升高</span><span class="si-val down">${volUp} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
      <div class="si"><span class="si-label">大盤波動變化</span><span class="si-val down">${DATA.stress.pvol.toFixed(1)}→${DATA.stress.svol.toFixed(1)}%</span></div>`;
    return;
  }
  const win=rows.filter(r=>r.ret>m).length;
  const avg=rows.reduce((s,r)=>s+r.ret,0)/rows.length;
  const med=median(rows.map(r=>r.ret));
  const best=rows.reduce((a,b)=>a.ret>b.ret?a:b), worst=rows.reduce((a,b)=>a.ret<b.ret?a:b);
  document.getElementById('summary').innerHTML=`
    <div class="si"><span class="si-label">檔數</span><span class="si-val">${rows.length}</span></div>
    <div class="si"><span class="si-label">大盤 YTD</span><span class="si-val ${cls(m)}">${m>=0?'+':''}${m.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">勝過大盤</span><span class="si-val up">${win} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
    <div class="si"><span class="si-label">平均報酬</span><span class="si-val ${cls(avg)}">${avg>=0?'+':''}${avg.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">中位數報酬</span><span class="si-val ${cls(med)}">${med>=0?'+':''}${med.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">最強</span><span class="si-val up">${best.name} +${best.ret.toFixed(0)}%</span></div>
    <div class="si"><span class="si-label">最弱</span><span class="si-val down">${worst.name} ${worst.ret.toFixed(0)}%</span></div>
    ${DATA.stress&&rows[0].sret!=null?`
    <div class="si" style="border-left:1px solid var(--border);padding-left:22px;">
      <span class="si-label" style="color:var(--red);">壓測 6/23高點→7/17</span>
      <span class="si-val down">大盤 ${DATA.stress.ret.toFixed(1)}%<span style="color:var(--text-muted);font-size:11px;font-weight:400;">（自盤中高點 ${DATA.stress.fromHigh.toFixed(1)}%）</span></span></div>
    <div class="si"><span class="si-label">平均壓測跌幅</span><span class="si-val down">${(rows.reduce((s,r)=>s+r.sret,0)/rows.length).toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">跌逾大盤</span><span class="si-val down">${rows.filter(r=>r.sret<DATA.stress.ret).length} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
    <div class="si"><span class="si-label">大盤波動變化</span><span class="si-val down">${DATA.stress.pvol.toFixed(1)}→${DATA.stress.svol.toFixed(1)}%</span></div>`:''}`;
}

function COLS(){
  if(mode==='rebound')
    return [['code','代號','l'],['name','名稱','l'],['reb','反彈%','n'],['ex','相對大盤%','n'],
      ['sret','壓測跌幅%','n'],['recov','收復率%','n'],['ret','YTD報酬%','n'],['last','現價','n']];
  if(mode==='stress')
    return [['code','代號','l'],['name','名稱','l'],['sret','壓測跌幅%','n'],['ex','相對大盤%','n'],
      ['svol','壓測波動%','n'],['pvol','高點前波動%','n'],['dvol','Δ波動','n'],
      ['ret','YTD報酬%','n'],['mdd','YTD回檔%','n'],['last','現價','n']];
  const cols=[['code','代號','l'],['name','名稱','l'],['ret','YTD報酬%','n'],['vol','年化波動%','n'],
    ['ex','相對大盤%','n'],['eff','報酬/波動','n'],['mdd','最大回檔%','n']];
  if(SNAP().rows[0].sret!=null)   // 壓測欄位只有最新快照有
    cols.push(['sret','壓測跌幅%','n'],['svol','壓測波動%','n'],['dvol','Δ波動','n']);
  cols.push(['last','現價','n']);
  return cols;
}
function renderTable(){
  const thead=document.querySelector('#tbl thead'), tbody=document.querySelector('#tbl tbody');
  const cols=COLS();
  thead.innerHTML='<tr>'+cols.map(c=>`<th class="${c[2]==='l'?'l':''}" onclick="sortBy('${c[0]}')">${c[1]}${sortKey===c[0]?(sortDir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>';
  const m=mktRet();
  const li=DATA.rebound?DATA.rebound.dates.length-1:0;
  const mkLast=DATA.rebound?DATA.rebound.market[li]:0;
  const rows=SNAP().rows.map(r=>{
    const reb=mode==='rebound'?DATA.rebound.rows[r.code][li]:null;
    return {...r,eff:r.ret/r.vol,dvol:r.sret!=null?r.svol-r.pvol:null,
      reb,recov:reb!=null?reb/Math.abs(r.sret)*100:null,
      ex:mode==='rebound'?reb-mkLast:RV(r)-m};
  });
  rows.sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return typeof va==='string'?sortDir*va.localeCompare(vb):sortDir*(va-vb);});
  const sgn=v=>v>=0?'up':'down', f=(v,d=1)=>(v>=0?'+':'')+v.toFixed(d);
  const cell=(r,k)=>{
    switch(k){
      case 'code': return `<td class="l code">${r.code}</td>`;
      case 'name': return `<td class="l name">${r.name}</td>`;
      case 'ret':  return `<td class="num ${sgn(r.ret)}">${f(r.ret)}</td>`;
      case 'vol':  return `<td class="num">${r.vol.toFixed(1)}</td>`;
      case 'ex':   return `<td class="num ${sgn(r.ex)}">${f(r.ex)}</td>`;
      case 'eff':  return `<td class="num">${r.eff.toFixed(2)}</td>`;
      case 'mdd':  return `<td class="num down">${r.mdd.toFixed(1)}</td>`;
      case 'sret': return `<td class="num ${sgn(r.sret)}">${f(r.sret)}</td>`;
      case 'svol': return `<td class="num">${r.svol.toFixed(1)}</td>`;
      case 'pvol': return `<td class="num">${r.pvol.toFixed(1)}</td>`;
      case 'dvol': return `<td class="num ${r.dvol>=0?'down':'up'}">${f(r.dvol)}</td>`;
      case 'reb':  return `<td class="num ${sgn(r.reb)}">${f(r.reb)}</td>`;
      case 'recov':return `<td class="num">${r.recov.toFixed(0)}</td>`;
      case 'last': return `<td class="num">${mode==='rebound'&&DATA.rebound.px?DATA.rebound.px[r.code]:r.last}</td>`;
    }
  };
  tbody.innerHTML=rows.map(r=>
    `<tr class="row${isHL(r)?' hl':''}">`+cols.map(c=>cell(r,c[0])).join('')+'</tr>'
  ).join('');
}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='code'||k==='name')?1:-1;}renderTable();}

function refresh(){if(chart)chart.destroy();buildChart();renderSummary();renderTable();
  const s=SNAP();
  const asof=mode==='rebound'?DATA.rebound.dates[DATA.rebound.dates.length-1]:s.asof;
  document.getElementById('subtitle').innerHTML=`持股組合 ${s.rows.length} 檔 vs ${s.market.name} · YTD 2026 · 資料截止 ${asof}`+
    (DATA.stress&&(mode==='rebound'||s.asof===DATA.asof)?`<span class="crash-badge">⚠ 7/17 大跌事件</span>`:'');}
function setDivider(m){dividerMode=m;document.getElementById('divMedian').classList.toggle('active',m==='median');
  document.getElementById('divMkt').classList.toggle('active',m==='mkt');refresh();}
function setMode(m){
  if(mode===m)return;
  stopPlay();
  mode=m;
  document.getElementById('tabYtd').classList.toggle('active',m==='ytd');
  document.getElementById('tabStress').classList.toggle('active',m==='stress');
  document.getElementById('tabRebound').classList.toggle('active',m==='rebound');
  const set=(id,v)=>document.getElementById(id).value=v, lbl=(id,t)=>document.getElementById(id).textContent=t;
  const dateVis=m==='ytd'?'':'none';
  document.getElementById('dateLabel').style.display=dateVis;
  document.getElementById('dateBtns').style.display=m==='ytd'?'inline-flex':'none';
  document.getElementById('playerBox').style.display=m==='rebound'?'inline-flex':'none';
  if(m==='ytd'){
    set('mktRet',SNAP().market.ret);set('mktVol',SNAP().market.vol);
    lbl('mktRetLabel','YTD報酬%');lbl('mktVolLabel','年化波動%');
    sortKey='ret';sortDir=-1;
  }else if(m==='stress'){
    set('mktRet',DATA.stress.ret);set('mktVol',DATA.stress.svol);
    lbl('mktRetLabel','壓測跌幅%');lbl('mktVolLabel','壓測波動%');
    sortKey='sret';sortDir=1;   // 最重挫排最前
  }else{
    frame=0;
    set('mktRet',DATA.rebound.market[0]);set('mktVol',DATA.stress.ret);  // 縱切線 = 大盤壓測跌幅
    lbl('mktRetLabel','大盤反彈%');lbl('mktVolLabel','跌幅分界%');
    sortKey='reb';sortDir=-1;   // 反彈最強排最前
  }
  const L=(c,t)=>`<span class="legend-item"><span class="dot" style="background:var(--${c})"></span>${t}</span>`;
  document.getElementById('legendBar').innerHTML=m==='ytd'
    ?L('green','贏大盤·低波動')+L('teal','贏大盤·高波動')+L('amber','輸大盤·低波動')+L('red','輸大盤·高波動')
    :m==='stress'
    ?L('green','抗跌·低波動')+L('teal','抗跌·高波動')+L('amber','重挫·低波動')+L('red','重挫·高波動')
    :L('green','跌深·反彈領先')+L('teal','抗跌·反彈領先')+L('amber','抗跌·反彈落後')+L('red','跌深·反彈落後');
  refresh();
  if(m==='rebound'){setFrame(0);setTimeout(startPlay,600);}  // 進場自動播放
}

// ── 反彈動畫播放 ──
let playTimer=null;
function setFrame(i){
  const R=DATA.rebound;
  frame=Math.max(0,Math.min(i,R.dates.length-1));
  document.getElementById('frameSlider').value=frame;
  const mk=R.market[frame];
  document.getElementById('frameInfo').textContent=
    `${MD(R.dates[frame])} 大盤 ${mk>=0?'+':''}${mk.toFixed(1)}%`;
  document.getElementById('mktRet').value=mk;
  if(!chart)return;
  chart.data.datasets[0].data=SNAP().rows.map(r=>({x:r.sret,y:REB(r),r:r}));
  chart.data.datasets[1].data=[{x:mktVol(),y:mk,mkt:true}];
  chart.update();
}
function startPlay(){
  if(playTimer||mode!=='rebound')return;
  if(frame>=DATA.rebound.dates.length-1)setFrame(0);
  document.getElementById('playBtn').textContent='⏸ 暫停';
  playTimer=setInterval(()=>{
    if(frame>=DATA.rebound.dates.length-1){stopPlay();return;}
    setFrame(frame+1);
  },1100);
}
function stopPlay(){
  if(playTimer){clearInterval(playTimer);playTimer=null;}
  const b=document.getElementById('playBtn');
  if(b)b.textContent='▶ 播放';
}
function togglePlay(){playTimer?stopPlay():startPlay();}
function toggleLabels(){showLabels=!showLabels;document.getElementById('lblBtn').textContent='標籤：'+(showLabels?'開':'關');chart.update();}
function onSearch(){highlight=document.getElementById('search').value.trim();chart.update();renderTable();}

function setDate(i){
  dateIdx=i;
  document.querySelectorAll('#dateBtns .btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  const s=DATA.snapshots[i];
  document.getElementById('mktRet').value=s.market.ret;
  document.getElementById('mktVol').value=s.market.vol;
  refresh();
}
function renderDateBtns(){
  const md=a=>{const [,m,d]=a.split('-');return `${+m}/${+d}`;};
  document.getElementById('dateBtns').innerHTML=DATA.snapshots.map((s,i)=>
    `<button class="btn${i===dateIdx?' active':''}" onclick="setDate(${i})">${s.label} ${md(s.asof)}</button>`).join('');
}
renderDateBtns();
if(DATA.rebound){
  const last=DATA.rebound.dates[DATA.rebound.dates.length-1];
  document.getElementById('tabRebound').textContent=`⚡ 反彈動畫 7/17→${MD(last)}`;
  document.getElementById('frameSlider').max=DATA.rebound.dates.length-1;
}else{
  document.getElementById('tabRebound').style.display='none';
}
document.getElementById('mktRet').addEventListener('input',refresh);
document.getElementById('mktVol').addEventListener('input',refresh);
refresh();
</script>
</body>
