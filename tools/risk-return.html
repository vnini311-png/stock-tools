<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報酬 vs 波動 落點分析</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080c18; --surface:#0f1624; --surface2:#161f33; --border:#1c2840;
    --accent:#4f8ef7; --accent2:#22d3ee; --text:#dde4f0; --text-muted:#4d6080;
    --green:#34d399; --teal:#22d3ee; --amber:#fbbf24; --red:#fb7185;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
  .header{background:linear-gradient(180deg,#0d1626 0%,#080c18 100%);border-bottom:1px solid var(--border);
    padding:18px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-left h1{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .header-left p{font-size:11px;color:var(--text-muted);margin-top:3px;letter-spacing:.4px;}
  .header-left-wrap{display:flex;align-items:center;}
  .back-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;margin-right:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);
    font-size:11px;text-decoration:none;font-family:'Noto Sans TC',sans-serif;transition:all .15s;white-space:nowrap;}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1);}
  .legend-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--text-muted);}
  .dot{width:10px;height:10px;border-radius:50%;}

  .controls{padding:14px 28px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ctrl-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px;}
  .btn{padding:5px 13px;border:1px solid var(--border);border-radius:5px;background:var(--surface);
    color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
  .btn:hover,.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1);}
  .field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;padding:3px 8px;}
  .field label{font-size:11px;color:var(--text-muted);}
  .field input{background:transparent;border:none;outline:none;color:var(--text);width:62px;
    font-family:'Space Mono',monospace;font-size:12px;}
  .search-input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);
    padding:5px 12px;font-size:12px;width:160px;outline:none;font-family:'Noto Sans TC',sans-serif;margin-left:auto;}
  .search-input:focus{border-color:var(--accent);}

  .summary{margin:12px 28px 0;padding:12px 18px;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  .si{display:flex;flex-direction:column;gap:1px;}
  .si-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
  .si-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;}
  .si-val.up{color:var(--green);} .si-val.down{color:var(--red);}

  .chart-wrap{margin:16px 28px 0;padding:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;height:600px;position:relative;}

  .table-wrap{margin:18px 28px 40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
    position:sticky;top:0;background:var(--surface2);user-select:none;}
  th:hover{color:var(--accent);}
  th.l,td.l{text-align:left;}
  td.code{font-family:'Space Mono',monospace;color:var(--accent2);}
  td.name{font-weight:600;}
  .num{font-family:'Space Mono',monospace;}
  .up{color:var(--green);} .down{color:var(--red);}
  tr.row:hover{background:rgba(79,142,247,.07);}
  tr.row.hl{background:rgba(245,158,11,.12);}
  .q-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;}
</style>
</head>
<body>
  <div class="header">
    <div class="header-left-wrap">
      <a href="../index.html" class="back-btn" title="返回工具列">← 工具列</a>
      <div class="header-left">
        <h1>報酬 vs 波動 · 落點分析</h1>
        <p id="subtitle">持股組合 36 檔 vs 加權指數 · YTD 2026 · 資料截止 2026-07-17</p>
      </div>
    </div>
    <div class="legend-bar">
      <span class="legend-item"><span class="dot" style="background:var(--green)"></span>贏大盤·低波動</span>
      <span class="legend-item"><span class="dot" style="background:var(--teal)"></span>贏大盤·高波動</span>
      <span class="legend-item"><span class="dot" style="background:var(--amber)"></span>輸大盤·低波動</span>
      <span class="legend-item"><span class="dot" style="background:var(--red)"></span>輸大盤·高波動</span>
    </div>
  </div>

  <div class="controls">
    <span class="ctrl-label">大盤基準</span>
    <div class="field"><label>YTD報酬%</label><input id="mktRet" type="number" step="0.1" value="47.33"></div>
    <div class="field"><label>年化波動%</label><input id="mktVol" type="number" step="0.1" value="30.33"></div>
    <span class="ctrl-label" style="margin-left:10px;">縱切線</span>
    <button class="btn" id="divMedian" onclick="setDivider('median')">波動中位數</button>
    <button class="btn active" id="divMkt" onclick="setDivider('mkt')">大盤波動</button>
    <button class="btn" id="lblBtn" onclick="toggleLabels()" style="margin-left:10px;">標籤：開</button>
    <input class="search-input" id="search" placeholder="搜尋代號/名稱…" oninput="onSearch()">
  </div>

  <div class="summary" id="summary"></div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div class="table-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>

<script>
const DATA = {"asof":"2026-07-17","market":{"name":"加權指數","ret":47.33,"vol":30.33,"mdd":-10.62},"rows":[{"code":"3026","name":"禾伸堂","base":102,"last":690,"ret":576.47,"vol":87.06,"mdd":-28.35},{"code":"6715","name":"嘉基","base":102.5,"last":391,"ret":281.46,"vol":94.96,"mdd":-35.41},{"code":"2327","name":"國巨","base":231,"last":699,"ret":202.6,"vol":79.63,"mdd":-38.68},{"code":"6285","name":"華星光","base":99,"last":234.5,"ret":136.87,"vol":80.32,"mdd":-26.75},{"code":"2454","name":"聯發科","base":1430,"last":3370,"ret":135.66,"vol":72.21,"mdd":-27.37},{"code":"3491","name":"昇達科","base":679,"last":1355,"ret":99.56,"vol":84.87,"mdd":-45.68},{"code":"6257","name":"光聖","base":116.5,"last":214.5,"ret":84.12,"vol":62.87,"mdd":-21.59},{"code":"2308","name":"台達電","base":963,"last":1740,"ret":80.69,"vol":63.66,"mdd":-30.95},{"code":"8155","name":"博智","base":168,"last":302,"ret":79.76,"vol":68.7,"mdd":-33.84},{"code":"7769","name":"鴻勁","base":3425,"last":6070,"ret":77.23,"vol":68.58,"mdd":-27.88},{"code":"2345","name":"智邦","base":1185,"last":2090,"ret":76.37,"vol":71.93,"mdd":-24},{"code":"2493","name":"揚博","base":121,"last":211.5,"ret":74.79,"vol":77.76,"mdd":-34.82},{"code":"3006","name":"晶豪科","base":118,"last":198,"ret":67.8,"vol":90.61,"mdd":-32.31},{"code":"2885","name":"元大金","base":39.3,"last":65,"ret":65.39,"vol":31.48,"mdd":-11.9},{"code":"2330","name":"台積電","base":1544.96,"last":2290,"ret":48.22,"vol":35.16,"mdd":-12.37},{"code":"5536","name":"聖暉","base":775.66,"last":1140,"ret":46.97,"vol":68.54,"mdd":-23.93},{"code":"2379","name":"瑞昱","base":489,"last":718,"ret":46.83,"vol":57.08,"mdd":-22.74},{"code":"3017","name":"奇鋐","base":1510,"last":2200,"ret":45.7,"vol":69.95,"mdd":-28.01},{"code":"5904","name":"寶雅","base":439.5,"last":615,"ret":39.93,"vol":36.55,"mdd":-16.55},{"code":"3036","name":"文曄","base":137,"last":188.5,"ret":37.59,"vol":52.36,"mdd":-37.48},{"code":"2368","name":"金像電","base":687,"last":927,"ret":34.93,"vol":72.41,"mdd":-37.99},{"code":"2357","name":"華碩","base":548,"last":700,"ret":27.74,"vol":46.3,"mdd":-29.43},{"code":"3044","name":"健鼎","base":317.5,"last":397.5,"ret":25.2,"vol":56.22,"mdd":-30.63},{"code":"8299","name":"群聯","base":1450,"last":1785,"ret":23.1,"vol":85.36,"mdd":-38.02},{"code":"2404","name":"漢唐","base":949,"last":1160,"ret":22.23,"vol":62.62,"mdd":-28.61},{"code":"2382","name":"廣達","base":272,"last":325.5,"ret":19.67,"vol":45.57,"mdd":-21.94},{"code":"5269","name":"祥碩","base":1210,"last":1435,"ret":18.6,"vol":61.38,"mdd":-24.29},{"code":"3211","name":"順達","base":337,"last":385.5,"ret":14.39,"vol":69.99,"mdd":-17.89},{"code":"3363","name":"台灣精銳","base":457.5,"last":504,"ret":10.16,"vol":86.06,"mdd":-49.09},{"code":"3596","name":"精誠","base":165.18,"last":181.5,"ret":9.88,"vol":40.93,"mdd":-23.75},{"code":"4979","name":"矽格","base":325.5,"last":356,"ret":9.37,"vol":90.32,"mdd":-50.42},{"code":"6643","name":"上詮","base":377,"last":391.5,"ret":3.85,"vol":68.04,"mdd":-43.83},{"code":"6442","name":"M31","base":1360,"last":1300,"ret":-4.41,"vol":87.75,"mdd":-45.15},{"code":"1519","name":"華城","base":765,"last":655,"ret":-14.38,"vol":54.49,"mdd":-39.35},{"code":"6805","name":"富士達","base":1625,"last":1345,"ret":-17.23,"vol":68.42,"mdd":-40.41},{"code":"6781","name":"AES-KY","base":1330,"last":960,"ret":-27.82,"vol":64.17,"mdd":-28.05}]};

const CSS = getComputedStyle(document.documentElement);
const C = n => CSS.getPropertyValue(n).trim();
let showLabels = true, dividerMode = 'mkt', highlight = '';
let sortKey = 'ret', sortDir = -1;

function median(arr){const a=[...arr].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function mktRet(){return parseFloat(document.getElementById('mktRet').value)||0;}
function mktVol(){const v=document.getElementById('mktVol').value;return v===''?null:parseFloat(v);}
function vDiv(){const mv=mktVol();return (dividerMode==='mkt'&&mv!=null)?mv:median(DATA.rows.map(r=>r.vol));}

function quadColor(r){
  const overMkt = r.ret >= mktRet();
  const hiVol = r.vol >= vDiv();
  if(overMkt && !hiVol) return C('--green');   // 贏大盤·低波動
  if(overMkt && hiVol)  return C('--teal');    // 贏大盤·高波動
  if(!overMkt && !hiVol)return C('--amber');   // 輸大盤·低波動
  return C('--red');                            // 輸大盤·高波動
}

// crosshair + quadrant background plugin
const crosshair = {
  id:'crosshair',
  beforeDatasetsDraw(chart){
    const {ctx,chartArea:a,scales:{x,y}} = chart;
    const yMkt = y.getPixelForValue(mktRet());
    const xDiv = x.getPixelForValue(vDiv());
    ctx.save();
    // quadrant shading (very subtle)
    const tints=[['--green',a.left,a.top,xDiv,yMkt],['--teal',xDiv,a.top,a.right,yMkt],
                 ['--amber',a.left,yMkt,xDiv,a.bottom],['--red',xDiv,yMkt,a.right,a.bottom]];
    tints.forEach(([col,x0,y0,x1,y1])=>{ctx.fillStyle=hexA(C(col),0.05);ctx.fillRect(x0,y0,x1-x0,y1-y0);});
    // lines
    ctx.setLineDash([5,4]); ctx.lineWidth=1.4;
    ctx.strokeStyle=hexA(C('--accent2'),0.85);
    ctx.beginPath();ctx.moveTo(a.left,yMkt);ctx.lineTo(a.right,yMkt);ctx.stroke();
    ctx.strokeStyle=hexA(C('--text-muted'),0.7);
    ctx.beginPath();ctx.moveTo(xDiv,a.top);ctx.lineTo(xDiv,a.bottom);ctx.stroke();
    ctx.setLineDash([]);
    // labels
    ctx.font="600 11px 'Space Mono',monospace";
    ctx.fillStyle=C('--accent2');ctx.textAlign='left';
    ctx.fillText(`大盤 ${mktRet().toFixed(1)}%`,a.left+6,yMkt-6);
    ctx.fillStyle=C('--text-muted');ctx.textAlign='center';
    ctx.fillText(dividerMode==='mkt'&&mktVol()!=null?'大盤波動':'波動中位數',xDiv,a.top+12);
    // quadrant captions
    ctx.font="700 12px 'Noto Sans TC'";ctx.globalAlpha=.5;
    ctx.fillStyle=C('--green');ctx.textAlign='left';ctx.fillText('高效率區（贏大盤·低波動）',a.left+8,a.top+30);
    ctx.fillStyle=C('--red');ctx.textAlign='right';ctx.fillText('警示區（輸大盤·高波動）',a.right-8,a.bottom-10);
    ctx.globalAlpha=1;ctx.restore();
  }
};
function hexA(hex,al){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${al})`;}

let chart;
function buildChart(){
  const pts = DATA.rows.map(r=>({x:r.vol,y:r.ret,r:r}));
  const mv = mktVol();
  const mktPoint = mv!=null ? [{x:mv,y:mktRet(),mkt:true}] : [];
  // explicit axis bounds with headroom so edge points + labels aren't clipped
  const vols=DATA.rows.map(r=>r.vol).concat(mv!=null?[mv]:[]);
  const rets=DATA.rows.map(r=>r.ret).concat([mktRet()]);
  const xMin=Math.floor((Math.min(...vols)-6)/5)*5, xMax=Math.ceil((Math.max(...vols)+7)/5)*5;
  const yMin=Math.floor((Math.min(...rets)-15)/10)*10, yMax=Math.ceil((Math.max(...rets)+30)/10)*10;
  const ctx=document.getElementById('chart');
  chart=new Chart(ctx,{
    type:'scatter',
    data:{datasets:[
      {label:'個股',data:pts,parsing:false,
        pointRadius:c=>pointR(c),pointHoverRadius:c=>pointR(c)+3,
        backgroundColor:c=>hexA(quadColor(c.raw.r),isHL(c.raw.r)?0.95:0.78),
        borderColor:c=>isHL(c.raw.r)?C('--amber'):'rgba(255,255,255,.25)',
        borderWidth:c=>isHL(c.raw.r)?2.5:1},
      {label:'大盤',data:mktPoint,parsing:false,pointStyle:'rectRot',pointRadius:11,pointHoverRadius:14,
        backgroundColor:C('--accent2'),borderColor:'#fff',borderWidth:2,datalabels:{display:false}}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:18,right:54,left:6,bottom:4}},
      scales:{
        x:{min:xMin,max:xMax,title:{display:true,text:'年化波動度 (%)　→ 風險越高',color:C('--text-muted'),font:{size:12}},
          grid:{color:'rgba(28,40,64,.6)'},ticks:{color:C('--text-muted')}},
        y:{min:yMin,max:yMax,title:{display:true,text:'YTD 報酬率 (%)　→ 表現越好',color:C('--text-muted'),font:{size:12}},
          grid:{color:'rgba(28,40,64,.6)'},ticks:{color:C('--text-muted')}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:c=>c[0].raw.mkt?'加權指數（大盤）':`${c[0].raw.r.code} ${c[0].raw.r.name}`,
          label:c=>{if(c.raw.mkt)return [`YTD報酬：${mktRet().toFixed(1)}%`,`年化波動：${DATA.market.vol.toFixed(1)}%`,`最大回檔：${DATA.market.mdd.toFixed(1)}%`];const r=c.raw.r;const ex=(r.ret-mktRet()).toFixed(1);
            return [`YTD報酬：${r.ret.toFixed(1)}%`,`年化波動：${r.vol.toFixed(1)}%`,`最大回檔：${r.mdd.toFixed(1)}%`,
              `相對大盤：${ex>=0?'+':''}${ex}%`,`報酬/波動：${(r.ret/r.vol).toFixed(2)}`,`價：${r.base}→${r.last}`];}
        }},
        datalabels:{display:c=>showLabels&&c.dataset.label==='個股',
          formatter:(v)=>v&&v.r?v.r.name:'',
          color:c=>{const p=c.dataset.data[c.dataIndex];return p&&p.r?quadColor(p.r):'#fff';},
          font:{size:9,weight:'600'},anchor:'end',align:'top',offset:3,clip:false}
      }
    },
    plugins:[crosshair,ChartDataLabels]
  });
}
function pointR(c){const r=c.raw.r; if(!r)return 6; const a=Math.abs(r.mdd); return 5+Math.min(a/6,7);}
function isHL(r){return highlight && (r.code.includes(highlight)||r.name.includes(highlight));}

function renderSummary(){
  const rows=DATA.rows, m=mktRet();
  const win=rows.filter(r=>r.ret>m).length;
  const avg=rows.reduce((s,r)=>s+r.ret,0)/rows.length;
  const med=median(rows.map(r=>r.ret));
  const best=rows.reduce((a,b)=>a.ret>b.ret?a:b), worst=rows.reduce((a,b)=>a.ret<b.ret?a:b);
  const cls=v=>v>=0?'up':'down';
  document.getElementById('summary').innerHTML=`
    <div class="si"><span class="si-label">檔數</span><span class="si-val">${rows.length}</span></div>
    <div class="si"><span class="si-label">大盤 YTD</span><span class="si-val ${cls(m)}">${m>=0?'+':''}${m.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">勝過大盤</span><span class="si-val up">${win} <span style="color:var(--text-muted);font-size:11px">/ ${rows.length}</span></span></div>
    <div class="si"><span class="si-label">平均報酬</span><span class="si-val ${cls(avg)}">${avg>=0?'+':''}${avg.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">中位數報酬</span><span class="si-val ${cls(med)}">${med>=0?'+':''}${med.toFixed(1)}%</span></div>
    <div class="si"><span class="si-label">最強</span><span class="si-val up">${best.name} +${best.ret.toFixed(0)}%</span></div>
    <div class="si"><span class="si-label">最弱</span><span class="si-val down">${worst.name} ${worst.ret.toFixed(0)}%</span></div>`;
}

const COLS=[['code','代號','l'],['name','名稱','l'],['ret','YTD報酬%','n'],['vol','年化波動%','n'],
  ['ex','相對大盤%','n'],['eff','報酬/波動','n'],['mdd','最大回檔%','n'],['last','現價','n']];
function renderTable(){
  const thead=document.querySelector('#tbl thead'), tbody=document.querySelector('#tbl tbody');
  thead.innerHTML='<tr>'+COLS.map(c=>`<th class="${c[2]==='l'?'l':''}" onclick="sortBy('${c[0]}')">${c[1]}${sortKey===c[0]?(sortDir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>';
  const m=mktRet();
  const rows=DATA.rows.map(r=>({...r,ex:r.ret-m,eff:r.ret/r.vol}));
  rows.sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return typeof va==='string'?sortDir*va.localeCompare(vb):sortDir*(va-vb);});
  tbody.innerHTML=rows.map(r=>{
    const hl=isHL(r)?' hl':'';
    const sgn=v=>v>=0?'up':'down', f=(v,d=1)=>(v>=0?'+':'')+v.toFixed(d);
    return `<tr class="row${hl}">
      <td class="l code">${r.code}</td><td class="l name">${r.name}</td>
      <td class="num ${sgn(r.ret)}">${f(r.ret)}</td>
      <td class="num">${r.vol.toFixed(1)}</td>
      <td class="num ${sgn(r.ex)}">${f(r.ex)}</td>
      <td class="num">${r.eff.toFixed(2)}</td>
      <td class="num down">${r.mdd.toFixed(1)}</td>
      <td class="num">${r.last}</td></tr>`;
  }).join('');
}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='code'||k==='name')?1:-1;}renderTable();}

function refresh(){if(chart)chart.destroy();buildChart();renderSummary();renderTable();
  document.getElementById('subtitle').textContent=`持股組合 ${DATA.rows.length} 檔 vs ${DATA.market.name} · YTD 2026 · 資料截止 ${DATA.asof}`;}
