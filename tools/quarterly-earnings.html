<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>季度獲利追蹤儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c18;
    --surface: #0f1624;
    --surface2: #161f33;
    --border: #1c2840;
    --accent: #34d399;
    --accent2: #22d3ee;
    --text: #dde4f0;
    --text-muted: #4d6080;
    --c-eps: #94a3b8;
    --c-gpm: #f97316;
    --c-opm: #fbbf24;
    --c-opx: #22d3ee;
    --c-up: #34d399;
    --c-down: #fb7185;
    --c-flat: #64748b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif; min-height:100vh; }

  .header {
    background:linear-gradient(180deg,#0d1626 0%,#080c18 100%);
    border-bottom:1px solid var(--border);
    padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    position:sticky; top:0; z-index:100;
  }
  .header-left h1 {
    font-family:'Space Mono',monospace; font-size:17px; font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header-left p { font-size:11px; color:var(--text-muted); margin-top:3px; letter-spacing:.4px; }

  .legend-bar { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:500; color:var(--text-muted); }
  .legend-dot { width:9px; height:9px; border-radius:50%; }
  .legend-dot.bar { width:14px; height:3px; border-radius:1px; }

  .back-btn {
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; margin-right:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    color:var(--text-muted); font-size:11px; text-decoration:none;
    font-family:'Noto Sans TC',sans-serif; transition:all .15s;
  }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(52,211,153,.1); }
  .header-left-wrap { display:flex; align-items:center; }

  .controls {
    padding:14px 28px 0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .ctrl-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-right:4px; }
  .btn {
    padding:5px 13px; border:1px solid var(--border); border-radius:5px;
    background:var(--surface); color:var(--text-muted); font-size:11px;
    cursor:pointer; transition:all .15s; font-family:'Noto Sans TC',sans-serif;
  }
  .btn:hover,.btn.active { border-color:var(--accent); color:var(--accent); background:rgba(52,211,153,.1); }
  .btn.filter-active { border-color:#f59e0b; color:#f59e0b; background:rgba(245,158,11,.1); }

  .summary {
    margin:12px 28px 0; padding:12px 18px;
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    display:flex; gap:28px; flex-wrap:wrap; align-items:center;
  }
  .si { display:flex; flex-direction:column; gap:1px; }
  .si-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; }
  .si-val { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; }
  .si-val.up { color:var(--c-up); }
  .si-val.down { color:var(--c-down); }

  .search-box { margin-left:auto; }
  .search-input {
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    color:var(--text); padding:5px 12px; font-size:12px; width:170px;
    outline:none; transition:border-color .15s; font-family:'Noto Sans TC',sans-serif;
  }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--text-muted); }

  .grid {
    padding:16px 28px 32px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:16px;
  }

  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
    transition:border-color .2s,transform .2s,box-shadow .2s;
  }
  .card:hover {
    border-color:var(--accent); transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(52,211,153,.12);
  }
  .card.fresh { border-color:#f59e0b44; }
  .card.fresh:hover { border-color:#f59e0b; box-shadow:0 6px 24px rgba(245,158,11,.12); }

  .card-head {
    padding:12px 16px 10px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--border);
  }
  .head-left { display:flex; align-items:baseline; }
  .stock-id { font-family:'Space Mono',monospace; font-size:10px; color:var(--accent2); letter-spacing:1px; margin-right:7px; }
  .stock-name { font-size:14px; font-weight:700; }
  .card-meta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .latest-q { font-family:'Space Mono',monospace; font-size:11px; color:var(--text-muted); }
  .badge-row { display:flex; gap:4px; align-items:center; }
  .badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; font-family:'Space Mono',monospace; }
  .badge.up { background:rgba(52,211,153,.12); color:var(--c-up); }
  .badge.down { background:rgba(251,113,133,.12); color:var(--c-down); }
  .badge.flat { background:rgba(100,116,139,.12); color:var(--c-flat); }
  .badge.new { background:rgba(245,158,11,.15); color:#f59e0b; }
  .badge.pending { background:rgba(100,116,139,.12); color:var(--c-flat); }
  .detail-link {
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; margin-left:2px;
    font-size:13px; color:var(--text-muted); text-decoration:none;
    border:1px solid var(--border); border-radius:4px;
    background:var(--surface2); transition:all .15s;
    font-family:'Space Mono',monospace;
  }
  .detail-link:hover { color:var(--accent); border-color:var(--accent); background:rgba(52,211,153,.1); transform:translateX(2px); }

  .metrics-row {
    display:grid; grid-template-columns:repeat(4,1fr);
    padding:10px 12px 6px; gap:6px;
    border-bottom:1px solid var(--border);
  }
  .metric { display:flex; flex-direction:column; gap:2px; padding:4px 2px; }
  .metric-label {
    font-size:9.5px; color:var(--text-muted); letter-spacing:.4px;
    display:flex; align-items:center; gap:4px;
  }
  .metric-label .ldot { width:6px; height:6px; border-radius:50%; }
  .metric-val { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; }
  .metric-val.na { color:var(--text-muted); font-size:11px; }
  .metric-yoy { font-family:'Space Mono',monospace; font-size:9.5px; font-weight:600; }
  .metric-yoy.up { color:var(--c-up); }
  .metric-yoy.down { color:var(--c-down); }
  .metric-yoy.flat { color:var(--c-flat); }

  .card-body { padding:6px 8px 10px; }
  canvas { max-height:180px; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--accent); }

  @media (max-width:600px) {
    .header { padding:14px 18px; }
    .controls, .summary { padding-left:18px; padding-right:18px; margin-left:0; margin-right:0; }
    .summary { margin:12px 18px 0; }
    .grid { padding:14px 18px 28px; grid-template-columns:1fr; }
    .search-box { margin-left:0; width:100%; }
    .search-input { width:100%; }
  }
</style>
</head>

<div class="header">

    </div>

  <button class="btn" data-sort="fresh" onclick="sortClick(this)">🆕 已公布最新季</button>
  <div class="search-box">

  </div>
</div>

// ── helpers
function isFresh(s) { return s.eps[LATEST_IDX] != null; }
function epsLatest(s) { return s.eps[LATEST_IDX] ?? s.eps[QOQ_IDX]; }
// Returns { value, kind } where kind ∈ { 'pct', 'flip_pos', 'flip_neg', 'na' }
// 'pct'      : a meaningful percentage
// 'flip_pos' : turned profitable (prev<=0, cur>0)
// 'flip_neg' : turned to loss (prev>=0, cur<0)
// 'na'       : base too small to give a sensible percentage
function calcChange(cur, prev) {
  if (cur == null || prev == null) return { value: null, kind: 'na' };
  if (prev <= 0 && cur > 0) return { value: cur - prev, kind: 'flip_pos' };
  if (prev >= 0 && cur < 0) return { value: cur - prev, kind: 'flip_neg' };
  if (Math.abs(prev) < 0.5) return { value: cur - prev, kind: 'na' };
  return { value: (cur - prev) / Math.abs(prev) * 100, kind: 'pct' };
}
function epsYoY(s) {
  const c = calcChange(s.eps[LATEST_IDX], s.eps[YOY_IDX]);
  return c.kind === 'pct' ? c.value : null; // numeric only, for sorting & medians
}
function epsYoYInfo(s) { return calcChange(s.eps[LATEST_IDX], s.eps[YOY_IDX]); }
function epsQoQ(s) {
  const c = calcChange(s.eps[LATEST_IDX], s.eps[QOQ_IDX]);
  return c.kind === 'pct' ? c.value : null;
}
function epsQoQInfo(s) { return calcChange(s.eps[LATEST_IDX], s.eps[QOQ_IDX]); }
function deltaPP(s, key) {
  // percentage-point change for margin (already in %)
  const arr = s[key]; const cur = arr[LATEST_IDX] ?? arr[QOQ_IDX];
  const idx = arr[LATEST_IDX] != null ? YOY_IDX : YOY_IDX - 1;
  const prev = arr[idx];
  if (cur == null || prev == null) return null;
  return cur - prev;
}
function latestVal(s, key) {
  const arr = s[key];
  return arr[LATEST_IDX] != null ? arr[LATEST_IDX] : arr[QOQ_IDX];
}
function fmtNum(v, digits=2) { return v == null ? '—' : v.toFixed(digits); }
function fmtPct(v, digits=1) { return v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(digits) + '%'; }
function fmtPP(v, digits=1) { return v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(digits) + 'pp'; }
function badgeClass(v) { return v == null ? 'flat' : (v > 0.05 ? 'up' : (v < -0.05 ? 'down' : 'flat')); }

function buildChart(canvas, s) {
  return new Chart(canvas, {
    type: 'bar',
    data: {
      labels: QUARTERS,
      datasets: [
        {
          type: 'bar',
          label: 'EPS',
          data: s.eps,
          backgroundColor: s.eps.map(v => v == null ? 'transparent' : (v < 0 ? 'rgba(153,27,27,.65)' : 'rgba(148,163,184,.45)')),
          borderColor: s.eps.map(v => v == null ? 'transparent' : (v < 0 ? '#991b1b' : COL.eps)),
          borderWidth: 1,
          yAxisID: 'yEps',
          order: 3,
        },
        {
          type: 'line',
          label: '毛利率',
          data: s.gpm,
          borderColor: COL.gpm,
          backgroundColor: 'rgba(249,115,22,.12)',
          borderWidth: 3.2,
          pointRadius: 2.8,
          pointHoverRadius: 6,
          pointBackgroundColor: COL.gpm,
          tension: 0.3,
          spanGaps: true,
          fill: true,
          yAxisID: 'yPct',
          order: 0,
        },
        {
          type: 'line',
          label: '營業利益率',
          data: s.opm,
          borderColor: COL.opm,
          backgroundColor: COL.opm + '20',
          borderWidth: 1.8,
          pointRadius: 1.5,
          pointHoverRadius: 5,
          tension: 0.3,
          spanGaps: true,
          yAxisID: 'yPct',
          order: 1,
        },
        {
          type: 'line',
          label: '營業費用率',
          data: s.opx,
          borderColor: COL.opx,
          backgroundColor: 'transparent',
          borderWidth: 1.8,
          borderDash: [6,4],
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          spanGaps: true,
          yAxisID: 'yPct',
          order: 2,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161f33', titleColor: '#8899b0', bodyColor: '#dde4f0',
          borderColor: '#1c2840', borderWidth: 1, padding: 10,
          callbacks: {
            label: ctx => {
              if (ctx.raw == null) return null;
              const unit = ctx.dataset.label === 'EPS' ? ' 元' : '%';
              return ` ${ctx.dataset.label}: ${Number(ctx.raw).toFixed(2)}${unit}`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1c284025' },
          ticks: { color: '#4d6080', font: { size: 8.5 }, maxRotation: 0, autoSkip: false }
        },
        yEps: {
          position: 'left',
          grid: { color: '#1c284025' },
          ticks: { color: COL.eps, font: { size: 9 } },
          title: { display: false }
        },
        yPct: {
          position: 'right',
          grid: { display: false },
          ticks: { color: '#4d6080', font: { size: 9 }, callback: v => v + '%' }
        }
      }
    }
  });
}

function metricHTML(label, color, val, sub, subClass, valFmt, isNA) {
  if (isNA) {
    return `<div class="metric">
      <span class="metric-label"><span class="ldot" style="background:${color}"></span>${label}</span>
      <span class="metric-val na">—</span>
      <span class="metric-yoy flat">不適用</span>
    </div>`;
  }
  return `<div class="metric">
    <span class="metric-label"><span class="ldot" style="background:${color}"></span>${label}</span>
    <span class="metric-val">${valFmt}</span>
    <span class="metric-yoy ${subClass}">${sub}</span>
  </div>`;
}

function renderCards(list) {
  const grid = document.getElementById('grid');
  charts.forEach(c => c.destroy()); charts = [];
  grid.innerHTML = '';

  list.forEach(s => {
    const fresh = isFresh(s);
    const eLatest = epsLatest(s);

    const gpmL = latestVal(s, 'gpm'); const gpmD = deltaPP(s, 'gpm');
    const opmL = latestVal(s, 'opm'); const opmD = deltaPP(s, 'opm');
    const opxL = latestVal(s, 'opx'); const opxD = deltaPP(s, 'opx');

    const card = document.createElement('div');
    card.className = 'card' + (fresh ? ' fresh' : '');

    const yi = epsYoYInfo(s);
    let yoyBadge;
    if (!fresh) {
      yoyBadge = `<span class="badge pending">未公布</span>`;
    } else if (yi.kind === 'pct') {
      yoyBadge = `<span class="badge ${badgeClass(yi.value)}">${fmtPct(yi.value)}</span>`;
    } else if (yi.kind === 'flip_pos') {
      yoyBadge = `<span class="badge up">轉盈</span>`;
    } else if (yi.kind === 'flip_neg') {
      yoyBadge = `<span class="badge down">轉虧</span>`;
    } else {
      yoyBadge = `<span class="badge flat">基期低</span>`;
    }
    const freshBadge = fresh ? `<span class="badge new">${QUARTERS[LATEST_IDX]}</span>` : '';
    const lastReportedIdx = fresh ? LATEST_IDX : (s.eps[QOQ_IDX] != null ? QOQ_IDX : null);
    const lastReportedLabel = lastReportedIdx != null ? `最新：${QUARTERS[lastReportedIdx]}` : '無資料';

    // QoQ display string for the EPS metric subline
    const qi = epsQoQInfo(s);
    let qoqSub, qoqCls;
    if (qi.kind === 'pct') { qoqSub = `QoQ ${fmtPct(qi.value)}`; qoqCls = badgeClass(qi.value); }
    else if (qi.kind === 'flip_pos') { qoqSub = `QoQ 轉盈`; qoqCls = 'up'; }
    else if (qi.kind === 'flip_neg') { qoqSub = `QoQ 轉虧`; qoqCls = 'down'; }
    else { qoqSub = `QoQ —`; qoqCls = 'flat'; }

    card.innerHTML = `
      <div class="card-head">
        <div class="head-left">
          <span class="stock-id">${s.id}</span>
          <span class="stock-name">${s.name}</span>
        </div>
        <div class="card-meta">
          <span class="latest-q">${lastReportedLabel}</span>
          <div class="badge-row">YoY ${yoyBadge}${freshBadge}<a href="stock-detail.html?id=${s.id}" class="detail-link" title="個股分析">→</a></div>
        </div>
      </div>
      <div class="metrics-row">
        ${metricHTML('EPS', COL.eps,
            eLatest, qoqSub,
            qoqCls, eLatest == null ? '—' : eLatest.toFixed(2) + '元', false)}
        ${metricHTML('毛利率', COL.gpm,
            gpmL, gpmD != null ? `YoY ${fmtPP(gpmD)}` : 'YoY —',
            badgeClass(gpmD), gpmL == null ? '—' : gpmL.toFixed(2) + '%', gpmL == null && opmL != null)}
        ${metricHTML('營益率', COL.opm,
            opmL, opmD != null ? `YoY ${fmtPP(opmD)}` : 'YoY —',
            badgeClass(opmD), opmL == null ? '—' : opmL.toFixed(2) + '%', false)}
        ${metricHTML('費用率', COL.opx,
            opxL, opxD != null ? `YoY ${fmtPP(-opxD)}` : 'YoY —',
            badgeClass(opxD == null ? null : -opxD),
            opxL == null ? '—' : opxL.toFixed(2) + '%', opxL == null && opmL != null)}
      </div>
      <div class="card-body">
        <canvas id="c${s.id}"></canvas>
      </div>
    `;
    grid.appendChild(card);
    charts.push(buildChart(document.getElementById('c' + s.id), s));
  });

  // Summary stats
  document.getElementById('s-count').textContent = list.length;
  const freshCount = list.filter(isFresh).length;
  document.getElementById('s-fresh').textContent = `${freshCount} / ${list.length}`;

  const yoys = list.map(epsYoY).filter(v => v != null).sort((a,b) => a-b);
  if (yoys.length) {
    const med = yoys[Math.floor(yoys.length/2)];
    document.getElementById('s-eps-med').textContent = fmtPct(med);
    const topV = yoys[yoys.length-1], botV = yoys[0];
    const topS = list.find(s => { const y = epsYoY(s); return y != null && Math.abs(y - topV) < 0.01; });
    const botS = list.find(s => { const y = epsYoY(s); return y != null && Math.abs(y - botV) < 0.01; });
    document.getElementById('s-eps-top').textContent = (topS?.name ?? '') + ' ' + fmtPct(topV);
    document.getElementById('s-eps-bot').textContent = (botS?.name ?? '') + ' ' + fmtPct(botV);
  } else {
    document.getElementById('s-eps-med').textContent = '—';
    document.getElementById('s-eps-top').textContent = '—';
    document.getElementById('s-eps-bot').textContent = '—';
  }
}

function getFiltered() {
  let list = [...STOCKS];
  if (searchQ) list = list.filter(s => s.id.includes(searchQ) || s.name.includes(searchQ));
  const NEG = -1e9;
  if (currentSort === 'eps_yoy') list.sort((a,b) => (epsYoY(b) ?? NEG) - (epsYoY(a) ?? NEG));
  else if (currentSort === 'eps_qoq') list.sort((a,b) => (epsQoQ(b) ?? NEG) - (epsQoQ(a) ?? NEG));
  else if (currentSort === 'gpm') list.sort((a,b) => (latestVal(b,'gpm') ?? NEG) - (latestVal(a,'gpm') ?? NEG));
  else if (currentSort === 'opm') list.sort((a,b) => (latestVal(b,'opm') ?? NEG) - (latestVal(a,'opm') ?? NEG));
  else if (currentSort === 'opm_improve') list.sort((a,b) => (deltaPP(b,'opm') ?? NEG) - (deltaPP(a,'opm') ?? NEG));
  else if (currentSort === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'zh-TW'));
  else if (currentSort === 'fresh') list.sort((a,b) => (isFresh(b)?1:0) - (isFresh(a)?1:0));
  else list.sort((a,b) => (isFresh(b)?1:0) - (isFresh(a)?1:0));  // 預設：已公布最新季者排前（組內保持原順序）
  return list;
}

function sortClick(btn) {
  document.querySelectorAll('.btn').forEach(b => { b.classList.remove('active'); b.classList.remove('filter-active'); });
  if (btn.dataset.sort === 'fresh') btn.classList.add('filter-active');
  else btn.classList.add('active');
  currentSort = btn.dataset.sort;
  renderCards(getFiltered());
}

function doSearch(q) {
  searchQ = q.trim();
  renderCards(getFiltered());
}

renderCards(getFiltered());
</script>
</body>
</html>
