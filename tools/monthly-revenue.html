<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月營收年度對比儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root {
    --bg: #080c18;
    --surface: #0f1624;
    --surface2: #161f33;
    --border: #1c2840;
    --accent: #4f8ef7;
    --accent2: #22d3ee;
    --text: #dde4f0;
    --text-muted: #4d6080;
    --y2023: #fbbf24;
    --y2024: #34d399;
    --y2025: #60a5fa;
    --y2026: #fb7185;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif; min-height:100vh; }

  .header {
    background:linear-gradient(180deg,#0d1626 0%,#080c18 100%);
    border-bottom:1px solid var(--border);
    padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .header-left h1 {
    font-family:'Space Mono',monospace; font-size:17px; font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header-left p { font-size:11px; color:var(--text-muted); margin-top:3px; letter-spacing:.4px; }

  .legend-bar { display:flex; gap:18px; align-items:center; }
  .legend-item { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; }
  .legend-line { width:26px; height:2.5px; border-radius:2px; }
  .legend-line.dashed { background:none !important; border-top:2.5px dashed var(--y2026); }

  .controls {
    padding:14px 28px 0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .ctrl-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-right:4px; }
  .btn {
    padding:5px 13px; border:1px solid var(--border); border-radius:5px;
    background:var(--surface); color:var(--text-muted); font-size:11px;
    cursor:pointer; transition:all .15s; font-family:'Noto Sans TC',sans-serif;
  }
  .btn:hover,.btn.active { border-color:var(--accent); color:var(--accent); background:rgba(79,142,247,.1); }
  .btn.filter-active { border-color:#f59e0b; color:#f59e0b; background:rgba(245,158,11,.1); }

  .summary {
    margin:12px 28px 0; padding:12px 18px;
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    display:flex; gap:28px; flex-wrap:wrap; align-items:center;
  }
  .si { display:flex; flex-direction:column; gap:1px; }
  .si-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; }
  .si-val { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; }
  .si-val.up { color:#34d399; }
  .si-val.down { color:#fb7185; }

  .search-box { margin-left:auto; }
  .search-input {
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    color:var(--text); padding:5px 12px; font-size:12px; width:170px;
    outline:none; transition:border-color .15s; font-family:'Noto Sans TC',sans-serif;
  }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--text-muted); }

  .back-btn {
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; margin-right:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    color:var(--text-muted); font-size:11px; text-decoration:none;
    font-family:'Noto Sans TC',sans-serif; transition:all .15s;
  }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(79,142,247,.1); }
  .header-left-wrap { display:flex; align-items:center; }

  .grid {
    padding:16px 28px 32px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(400px,1fr));
    gap:16px;
  }

  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
    transition:border-color .2s,transform .2s,box-shadow .2s;
  }
  .card:hover {
    border-color:var(--accent); transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(79,142,247,.12);
  }
  .card.has-apr { border-color:#f59e0b44; }
  .card.has-apr:hover { border-color:#f59e0b; box-shadow:0 6px 24px rgba(245,158,11,.12); }

  .card-head {
    padding:12px 16px 10px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--border);
  }
  .head-left { display:flex; align-items:baseline; }
  .stock-id { font-family:'Space Mono',monospace; font-size:10px; color:var(--accent2); letter-spacing:1px; margin-right:7px; }
  .stock-name { font-size:14px; font-weight:700; }
  .card-meta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .latest { font-family:'Space Mono',monospace; font-size:12px; color:var(--y2026); font-weight:700; }
  .badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; }
  .badge.up { background:rgba(52,211,153,.12); color:#34d399; }
  .badge.down { background:rgba(251,113,133,.12); color:#fb7185; }
  .badge.new { background:rgba(245,158,11,.15); color:#f59e0b; }

  .card-body { padding:10px 12px 12px; }
  canvas { max-height:170px; }

  .highlight-bar {
    margin:6px 0 0; padding:6px 10px;
    background:rgba(245,158,11,.06);
    border:1px solid rgba(245,158,11,.2);
    border-radius:5px;
    font-size:10px; color:#d4900a; line-height:1.5;
  }
  .highlight-bar strong { color:#f59e0b; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--accent); }
</style>
</head>

 "5": 31566805, "6": 38218758, "7": 31763135, "8": 42256360, "9": 36078033, "10": 42810847, "11": 43071172, "12": 43679986}, "2024": {"1": 44496290, "2": 38481870, "3": 50479987, "4": 42027887, "5": 42151178, "6": 43092056, "7": 45609723, "8": 41527835, "9": 44675936, "10": 51117348, "11": 45242346, "12": 41683430}, "2025": {"1": 51144288, "2": 46171723, "3": 55996226, "4": 48754424, "5": 45180526, "6": 56433621, "7": 43220164, "8": 44546643, "9": 54330057, "10": 52026251, "11": 46895680, "12": 51266079}, "2026": {"1": 46977055, "2": 38954271, "3": 63219184, "4": 46736664}}}];
const HIGHLIGHTS = {"3006": {"yoy": "+349.21%", "note": "創歷史新高，受惠記憶體漲價與需求強勁"}, "2382": {"yoy": "+58.20%", "note": "創同期新高，AI 伺服器出貨動能持續爆發"}, "3017": {"yoy": "+71.62%", "note": "創同期新高，受惠 AI 散熱模組需求"}, "2308": {"yoy": null, "note": "4/30 法說會確認 Q1 營收與毛利刷新紀錄"}};
const COLORS = {2023:'#fbbf24',2024:'#34d399',2025:'#60a5fa',2026:'#fb7185'};
const YEARS = [2023,2024,2025,2026];

let currentSort = 'default';
let searchQ = '';
let charts = [];

function fmt(v) {
  if (v == null) return '—';
  if (v >= 1e8) return (v/1e8).toFixed(2)+'億';
  if (v >= 1e4) return (v/1e4).toFixed(0)+'萬';
  return v.toLocaleString();
}

function getLatestMonth(s) {
  const yr = s.byYear['2026'] || {};
  const months = Object.keys(yr).map(Number).sort((a,b)=>b-a);
  return months[0] ?? null;
}

function getYoY(s) {
  const latestM = getLatestMonth(s);
  if (!latestM) return null;
  const r26 = s.byYear['2026']?.[latestM];
  const r25 = s.byYear['2025']?.[latestM];
  if (!r26 || !r25) return null;
  return (r26 - r25) / r25 * 100;
}

function getLatestRev(s) {
  const m = getLatestMonth(s);
  return m ? s.byYear['2026'][m] : s.byYear['2025']?.[12];
}

function hasMay(s) { return !!s.byYear['2026']?.[5]; }

function buildChart(canvas, s) {
  const latestM = getLatestMonth(s);
  const latestIdx = latestM ? latestM - 1 : -1;
  const datasets = YEARS.map(yr => {
    const yd = s.byYear[String(yr)] || {};
    const vals = Array.from({length:12}, (_, i) => yd[i+1] ?? null);
    return {
      label: String(yr),
      data: vals,
      borderColor: COLORS[yr],
      backgroundColor: COLORS[yr] + '15',
      borderWidth: yr >= 2025 ? 2.5 : 1.8,
      borderDash: yr === 2026 ? [5,4] : [],
      pointRadius: vals.map((v,i) => {
        if (v == null) return 0;
        // Highlight April 2026 point
        if (yr === 2026 && i === latestIdx) return 5;
        return 2.5;
      }),
      pointHoverRadius: 6,
      pointBackgroundColor: vals.map((v,i) =>
        yr === 2026 && i === latestIdx ? '#f59e0b' : COLORS[yr]
      ),
      pointBorderColor: vals.map((v,i) =>
        yr === 2026 && i === latestIdx ? '#f59e0b' : COLORS[yr]
      ),
      tension: 0.38,
      fill: false,
      spanGaps: false
    };
  });
  return new Chart(canvas, {
    type: 'line',
    data: {labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], datasets},
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: {mode:'index', intersect:false},
      plugins: {
        legend: {display:false},
        tooltip: {
          backgroundColor:'#161f33', titleColor:'#8899b0', bodyColor:'#dde4f0',
          borderColor:'#1c2840', borderWidth:1, padding:10,
          callbacks: {
            label: ctx => ctx.raw == null ? null : ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`
          }
        }
      },
      scales: {
        x: {grid:{color:'#1c284025'}, ticks:{color:'#4d6080', font:{size:9}, maxRotation:0}},
        y: {grid:{color:'#1c284025'}, ticks:{color:'#4d6080', font:{size:9}, callback: v => fmt(v)}}
      }
    }
  });
}

function renderCards(list) {
  const grid = document.getElementById('grid');
  charts.forEach(c => c.destroy()); charts = [];
  grid.innerHTML = '';

  list.forEach(s => {
    const yoy = getYoY(s);
    const latest = getLatestRev(s);
    const latestM = getLatestMonth(s);
    const isMay = hasMay(s);
    const hl = HIGHLIGHTS[s.id];

    const card = document.createElement('div');
    card.className = 'card' + (isMay ? ' has-apr' : '');

    const yoyBadge = yoy != null
      ? `<span class="badge ${yoy >= 0 ? 'up' : 'down'}">${yoy >= 0 ? '+' : ''}${yoy.toFixed(1)}%</span>`
      : '';
    const newBadge = isMay ? `<span class="badge new">${latestM}月已公布</span>` : '';
    const latestLabel = latestM ? `26/${String(latestM).padStart(2,'0')}` : '最新';

    let hlHTML = '';
    if (hl && isMay) {
      hlHTML = `<div class="highlight-bar">
        <strong>${hl.yoy ? 'YoY ' + hl.yoy + '　' : ''}${hl.note}</strong>
      </div>`;
    } else if (hl && !isMay && hl.note) {
      hlHTML = `<div class="highlight-bar">${hl.note}</div>`;
    }

    card.innerHTML = `
      <div class="card-head">
        <div class="head-left">
          <span class="stock-id">${s.id}</span>
          <span class="stock-name">${s.name}</span>
        </div>
        <div class="card-meta">
          <span class="latest">${fmt(latest)}</span>
          <div style="display:flex;gap:4px;align-items:center">${yoyBadge}${newBadge}</div>
        </div>
      </div>
      <div class="card-body">
        <canvas id="c${s.id}"></canvas>
        ${hlHTML}
      </div>
    `;
    grid.appendChild(card);
    charts.push(buildChart(document.getElementById('c' + s.id), s));
  });

  // Summary
  document.getElementById('s-count').textContent = list.length;
  document.getElementById('s-apr').textContent = list.filter(hasMay).length + ' / ' + list.length;

  const yoys = list.map(s => getYoY(s)).filter(v => v != null).sort((a,b) => a - b);
  if (yoys.length) {
    const med = yoys[Math.floor(yoys.length / 2)];
    document.getElementById('s-med').textContent = (med >= 0 ? '+' : '') + med.toFixed(1) + '%';
    const topV = yoys[yoys.length - 1], botV = yoys[0];
    const topS = list.find(s => { const y = getYoY(s); return y != null && Math.abs(y - topV) < 0.1; });
    const botS = list.find(s => { const y = getYoY(s); return y != null && Math.abs(y - botV) < 0.1; });
    document.getElementById('s-top').textContent = (topS?.name ?? '') + ' +' + topV.toFixed(1) + '%';
    document.getElementById('s-bot').textContent = (botS?.name ?? '') + ' ' + botV.toFixed(1) + '%';
  }
}

function getFiltered() {
  let list = [...STOCKS];
  if (searchQ) list = list.filter(s => s.id.includes(searchQ) || s.name.includes(searchQ));
  if (currentSort === 'yoy_desc') list.sort((a,b) => (getYoY(b) ?? -9999) - (getYoY(a) ?? -9999));
  else if (currentSort === 'yoy_asc') list.sort((a,b) => (getYoY(a) ?? 9999) - (getYoY(b) ?? 9999));
  else if (currentSort === 'rev_desc') list.sort((a,b) => (getLatestRev(b) ?? 0) - (getLatestRev(a) ?? 0));
  else if (currentSort === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'zh-TW'));
  else if (currentSort === 'has_may') list.sort((a,b) => (hasMay(b)?1:0) - (hasMay(a)?1:0));
  return list;
}

function sortClick(btn) {
  document.querySelectorAll('.btn').forEach(b => { b.classList.remove('active'); b.classList.remove('filter-active'); });
  if (btn.dataset.sort === 'has_may') btn.classList.add('filter-active');
  else btn.classList.add('active');
  currentSort = btn.dataset.sort;
  renderCards(getFiltered());
}

function doSearch(q) {
  searchQ = q.trim();
  renderCards(getFiltered());
}

renderCards(getFiltered());
