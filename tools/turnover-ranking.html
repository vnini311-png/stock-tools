<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成交值排行榜 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3240;
    --txt:#e6edf3; --muted:#8b949e; --tw:#f0883e; --us:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;padding:0 24px 24px;}
  .toolbar{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:16px;padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--txt);
    border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .backbtn:hover{border-color:var(--us);color:#fff}
  .ttl{font-size:18px;font-weight:700;letter-spacing:.5px}
  .ttl .sub{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
  .tabs{margin-left:auto;display:flex;gap:8px}
  .tab{background:var(--panel2);color:var(--muted);border:1px solid var(--border);border-radius:9px;
    padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .tab .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .tab.active{color:#fff}
  .tab[data-mk="tw"].active{border-color:var(--tw);background:rgba(240,136,62,.15)}
  .tab[data-mk="us"].active{border-color:var(--us);background:rgba(88,166,255,.15)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:1080px;margin:0 auto}
  .ptitle{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:2px}
  .dot{width:10px;height:10px;border-radius:50%}
  .kpis{display:flex;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
  .kpi{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;flex:1;min-width:120px}
  .kpi .label{color:var(--muted);font-size:11px}
  .kpi .val{font-size:18px;font-weight:700;margin-top:2px}
  .cols{display:grid;grid-template-columns:1.3fr .9fr;gap:18px;margin-top:8px}
  @media(max-width:840px){.cols{grid-template-columns:1fr}}
  .chartbox{position:relative;height:560px}
  .doughbox{position:relative;height:280px}
  .sech{color:var(--muted);font-size:12px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:11px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--panel2)}
  .rank{color:var(--muted);width:28px}
  .code{color:var(--muted);font-size:12px}
  .bar-cell{width:90px}
  .minibar{height:7px;border-radius:4px}
  .market{display:none}
  .market.active{display:block}
  .foot{color:var(--muted);font-size:11px;margin-top:22px;text-align:center}
</style>
</head>
<body>
<div class="toolbar">
  <a class="backbtn" href="../index.html">&#8592; 返回工具列</a>
  <div class="ttl">成交值排行榜 Dashboard<span class="sub">台股 2026/06/15 ・ 美股 2026/06/14 ・ Top 20</span></div>
  <div class="tabs">
    <button class="tab active" data-mk="tw"><span class="d" style="background:var(--tw)"></span>台股</button>
    <button class="tab" data-mk="us"><span class="d" style="background:var(--us)"></span>美股</button>
  </div>
</div>

<!-- 台股 -->
<div class="market active" id="mk-tw">
  <div class="panel">
    <div class="ptitle"><span class="dot" style="background:var(--tw)"></span>台股成交值排行 <span style="color:var(--muted);font-weight:400;font-size:13px">(億 TWD)</span></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Top20 總成交值</div><div class="val" id="tw-total"></div></div>
      <div class="kpi"><div class="label">龍頭</div><div class="val" id="tw-top"></div></div>
      <div class="kpi"><div class="label">最大產業</div><div class="val" id="tw-ind"></div></div>
    </div>
    <div class="cols">
      <div><div class="sech">成交值（億）</div><div class="chartbox"><canvas id="twBar"></canvas></div></div>
      <div><div class="sech">產業占比</div><div class="doughbox"><canvas id="twDough"></canvas></div></div>
    </div>
    <div class="sech">明細</div>
    <table id="twTable"><thead><tr><th class="rank">#</th><th>股票</th><th>產業</th><th class="num">成交值</th><th class="bar-cell"></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<!-- 美股 -->
<div class="market" id="mk-us">
  <div class="panel">
    <div class="ptitle"><span class="dot" style="background:var(--us)"></span>美股成交值排行 <span style="color:var(--muted);font-weight:400;font-size:13px">(億 USD)</span></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Top20 總成交值</div><div class="val" id="us-total"></div></div>
      <div class="kpi"><div class="label">龍頭</div><div class="val" id="us-top"></div></div>
      <div class="kpi"><div class="label">最大產業</div><div class="val" id="us-ind"></div></div>
    </div>
    <div class="cols">
      <div><div class="sech">成交值（億 USD）</div><div class="chartbox"><canvas id="usBar"></canvas></div></div>
      <div><div class="sech">產業占比</div><div class="doughbox"><canvas id="usDough"></canvas></div></div>
    </div>
    <div class="sech">明細</div>
    <table id="usTable"><thead><tr><th class="rank">#</th><th>股票</th><th>產業</th><th class="num">成交值</th><th class="bar-cell"></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div class="foot">資料來源：上班族型交易者 APP・成交值排行榜。台股基準 2026-06-15，美股基準 2026-06-14。</div>

<script>
const TW=[
 ["台積電","2330","半導體",600.6],["南亞科","2408","記憶體",511.4],["聯發科","2454","IC設計",462.3],
 ["聯電","2303","半導體",457.0],["華邦電","2344","記憶體",417.1],["國巨*","2327","被動元件",371.5],
 ["臻鼎-KY","4958","PCB",292.4],["台達電","2308","電源/散熱",195.6],["華通","2313","PCB",187.9],
 ["力成","6239","封測",172.6],["欣興","3037","PCB",146.2],["鴻海","2317","EMS/組裝",143.2],
 ["大立光","3008","光學鏡頭",142.6],["景碩","3189","PCB",133.4],["日月光投控","3711","封測",130.3],
 ["群聯","8299","IC設計",126.1],["穩懋","3105","化合物半導體",118.9],["晶技","3042","石英元件",116.7],
 ["台光電","2383","PCB材料",101.5],["南亞","1303","塑化/電子材料",96.6]
];
const US=[
 ["美光科技","MU","記憶體",402],["特斯拉","TSLA","電動車",259],["輝達","NVDA","Semiconductors",231],
 ["英特爾","INTC","Semiconductors",189],["超微半導體","AMD","Semiconductors",162],["微軟","MSFT","Technology",137],
 ["亞馬遜","AMZN","Consumer Discretionary",122],["邁威爾科技","MRVL","Semiconductors",118],["蘋果","AAPL","Technology",113],
 ["博通","AVGO","Semiconductors",106],["Alphabet","GOOGL","Communication Services",89],["Meta","META","Communication Services",81],
 ["Rocket Lab","RKLB","Industrials",65],["Alphabet","GOOG","Communication Services",63],["安謀控股","ARM","Semiconductors",63],
 ["EchoStar","SATS","Communication Services",57],["甲骨文","ORCL","Technology",54],["Adobe","ADBE","Technology",51],
 ["艾司摩爾控股","ASML","Semiconductors",47],["應用材料","AMAT","Semiconductors",46]
];

const PALETTE=["#f0883e","#58a6ff","#3fb950","#bc8cff","#ff7b72","#56d4dd","#e3b341","#db61a2","#79c0ff","#7ee787","#ffa657","#d2a8ff","#a5d6ff","#f778ba","#56d364"];
Chart.defaults.color="#8b949e";
Chart.defaults.font.family='"Microsoft JhengHei","Noto Sans TC",sans-serif';

function industryColors(rows){
  const inds=[...new Set(rows.map(r=>r[2]))];
  const map={}; inds.forEach((n,i)=>map[n]=PALETTE[i%PALETTE.length]);
  return map;
}
function fmt(n,cur){return (cur||"")+n.toLocaleString(undefined,{maximumFractionDigits:1});}

function build(rows, ids, cur){
  const cmap=industryColors(rows);
  const total=rows.reduce((s,r)=>s+r[3],0);
  const aggMap={}; rows.forEach(r=>aggMap[r[2]]=(aggMap[r[2]]||0)+r[3]);
  const agg=Object.entries(aggMap).sort((a,b)=>b[1]-a[1]);

  document.getElementById(ids.total).textContent=fmt(total,cur);
  document.getElementById(ids.top).textContent=rows[0][0];
  document.getElementById(ids.ind).textContent=agg[0][0];

  new Chart(document.getElementById(ids.bar),{
    type:"bar",
    data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[3]),
      backgroundColor:rows.map(r=>cmap[r[2]]),borderRadius:4,barThickness:16}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>" "+fmt(c.raw,cur)+"  ["+rows[c.dataIndex][2]+"]"}}},
      scales:{x:{grid:{color:"#2a3240"}},y:{grid:{display:false},ticks:{font:{size:11}}}}}
  });
  new Chart(document.getElementById(ids.dough),{
    type:"doughnut",
    data:{labels:agg.map(a=>a[0]),datasets:[{data:agg.map(a=>a[1]),
      backgroundColor:agg.map(a=>cmap[a[0]]),borderColor:"#161b22",borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",
      plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10},padding:6}},
        tooltip:{callbacks:{label:c=>" "+c.label+": "+fmt(c.raw,cur)+" ("+(c.raw/total*100).toFixed(1)+"%)"}}}}
  });
  const max=rows[0][3];
  const tb=document.querySelector("#"+ids.table+" tbody");
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="rank">${i+1}</td>
      <td>${r[0]} <span class="code">${r[1]}</span></td>
      <td style="color:${cmap[r[2]]}">${r[2]}</td>
      <td class="num">${fmt(r[3],cur)}</td>
      <td class="bar-cell"><div class="minibar" style="width:${r[3]/max*100}%;background:${cmap[r[2]]}"></div></td>`;
    tb.appendChild(tr);
  });
}

const built={tw:false,us:false};
function activate(mk){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mk===mk));
  document.querySelectorAll(".market").forEach(m=>m.classList.toggle("active",m.id==="mk-"+mk));
  if(!built[mk]){
    if(mk==="tw") build(TW,{total:"tw-total",top:"tw-top",ind:"tw-ind",bar:"twBar",dough:"twDough",table:"twTable"},"");
    else build(US,{total:"us-total",top:"us-top",ind:"us-ind",bar:"usBar",dough:"usDough",table:"usTable"},"$");
    built[mk]=true;
  }
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>activate(t.dataset.mk)));
activate("tw");
</script>
</body>
</html>
